name: Mixdog release package

# Match the evaluation tools workflow so a pull request branch is checked once, not
# once for the push and again for the pull request.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -p test_package_mixdog.py
      - if: runner.os == 'Linux'
        run: python scripts/package-mixdog.py --check-release
