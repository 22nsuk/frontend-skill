name: Evaluation tools

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    name: Rust snapshot CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked --manifest-path tools/eval-workspace-snapshot/Cargo.toml

  stub:
    name: Reservation stub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test tests/eval-stub-server.test.js
      - if: runner.os == 'Linux'
        run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: npm run typecheck
