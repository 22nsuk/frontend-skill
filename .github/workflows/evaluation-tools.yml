name: Evaluation tools

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    name: Rust snapshot CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting and lints
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check --manifest-path tools/eval-workspace-snapshot/Cargo.toml
          cargo clippy --locked --manifest-path tools/eval-workspace-snapshot/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/eval-workspace-snapshot/Cargo.toml
      - name: Check benchmark driver on the workshop fixture
        timeout-minutes: 5
        working-directory: tools/eval-workspace-snapshot
        run: cargo run --locked --example benchmark -- --smoke target/debug/eval-workspace-snapshot${{ runner.os == 'Windows' && '.exe' || '' }}

  stub:
    name: Reservation stub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright-core install --with-deps --only-shell chromium
      - run: node --test tests/eval-stub-server.test.js tests/eval-fixture-baseline.test.js
      - name: Type-check the reservation stub and Mixdog manifest helper
        if: runner.os == 'Linux'
        run: npm run typecheck
