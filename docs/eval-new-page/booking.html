  <title>예약 안내 | 동네수리공방</title>
</head>
<body>
  <main>
    <h1>동네수리공방 예약 안내</h1>
    <p>방문 신청서를 제출해도 바로 예약되지는 않습니다.</p>
    <ol>
      <li>공방의 온라인 방문 신청서에 <strong>수리할 물건, 고장 증상, 희망 방문일, 회신 연락처</strong>를 적습니다.</li>
      <li>신청서를 제출하면 방문 요청이 접수됩니다. 희망 방문일은 아직 확정된 일정이 아닙니다.</li>
      <li>담당자가 전화로 방문 시간을 조율합니다. 양쪽이 시간에 동의하면 예약이 확정됩니다.</li>
    </ol>
    <p>가상의 업체를 위한 안내 예시입니다. 이 페이지에는 실제 신청서가 없으며 개인정보를 받지 않습니다.</p>
  </main>
</body>
</html>
